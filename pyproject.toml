[project]
name = "pyviaggiatreno"
version = "0.1.2"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/viaggiatreno", "packages/viaggiatreno_mcp"]

[tool.uv.sources]
viaggiatreno = { workspace = true }
viaggiatreno-mcp = { workspace = true }

[dependency-groups]
dev = [
    # Workspace members: installed editable so tests/pyright resolve them.
    "viaggiatreno",
    "viaggiatreno-mcp",
    "ruff",
    "pyright",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.pyright]
pythonVersion = "3.12"
