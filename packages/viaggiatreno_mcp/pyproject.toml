[build-system]
requires = ["hatchling>=1.32", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "viaggiatreno-mcp"
dynamic = ["version"]
description = "ViaggiaTreno MCP Server for Claude and pi"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Matteo Redaelli", email = "matteo.redaelli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "viaggiatreno>=0.1.0",
    "fastmcp>=4.0.10",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
viaggiatreno-mcp = "viaggiatreno_mcp.server:main"

[project.urls]
Homepage = "https://github.com/matteoredaelli/pyviaggiatreno"
Documentation = "https://github.com/matteoredaelli/pyviaggiatreno/blob/main/README.md"
Repository = "https://github.com/matteoredaelli/pyviaggiatreno.git"
Issues = "https://github.com/matteoredaelli/pyviaggiatreno/issues"

# Derive the version from Git tags (e.g. tag "v0.5.0" -> version "0.5.0").
# The repository root is two levels up from this package.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

# Write the resolved version to a generated module so it is importable at
# runtime (viaggiatreno_mcp.__version__) without re-inspecting Git.
[tool.hatch.build.hooks.vcs]
version-file = "src/viaggiatreno_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/viaggiatreno_mcp"]
